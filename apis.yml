aid: optimity
name: Optimity
description: >-
  Optimity is a health and rewards platform (myoptimity.com) that helps millions of members live
  healthier, wealthier, and longer through gamified micro-learning, wellness challenges, and
  behavioral-science-backed coaching across physical activity, nutrition, mental health, social
  connectedness, and financial wellness. Its consumer apps sync steps from Google Fit, Fitbit, and
  Samsung Health, while its enterprise Engagement Operating System (EOS) offers white-labeled apps,
  a management portal, rewards and nudge programs, and enterprise "API solutions & Tools" with
  developer-friendly modules for insurers, employers, and communities. Optimity is a 500 Global
  portfolio company. No public developer portal, API documentation, OpenAPI specification, or SDK
  is currently published; API access is offered privately to enterprise customers.
